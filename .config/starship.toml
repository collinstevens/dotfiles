"$schema" = "https://starship.rs/config-schema.json"

format = "$hostname$directory$git_branch$git_status$line_break$character"
add_newline = false
scan_timeout = 10
command_timeout = 500

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold green"
trim_at = "."

[directory]
format = "[$path]($style) "
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
substitutions = [{ from = '(?i)^C:/Users/[^/]+$', to = '~', regex = true }]

[git_branch]
format = "[$branch]($style) "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
